<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Поддержка автора</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: var(--tg-theme-bg-color, #131722);
      --card-bg: var(--tg-theme-secondary-bg-color, #1e2430);
      --text-color: var(--tg-theme-text-color, #f5f6f8);
      --hint-color: var(--tg-theme-hint-color, #9da7b3);
      --accent-color: #8b5cf6; /* Нежно-фиолетовый акцент */
      --accent-hover: #7c3aed;
      --button-text: #ffffff;
      --da-color: #f57c00; /* Оранжевый акцент для DonationAlerts */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 20px 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .donate-card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 24px 20px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      text-align: center;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    }

    .avatar {
      font-size: 42px;
      margin-bottom: 12px;
    }

    .donate-card h1 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .donate-card p {
      font-size: 13px;
      color: var(--hint-color);
      margin-bottom: 20px;
      line-height: 1.45;
    }

    /* Быстрый выбор сумм */
    .donate-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }

    .donate-option {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 12px 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.2s ease;
    }

    .donate-option.active {
      border-color: var(--accent-color);
      background: rgba(139, 92, 246, 0.18);
      color: #c4b5fd;
    }

    /* Поле ввода произвольной суммы */
    .input-wrapper {
      position: relative;
      margin-bottom: 20px;
    }

    .custom-donate-input {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 14px 16px;
      color: var(--text-color);
      font-size: 16px;
      font-weight: 600;
      text-align: center;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .custom-donate-input:focus {
      border-color: var(--accent-color);
    }

    .custom-donate-input::placeholder {
      color: var(--hint-color);
      font-weight: 400;
      font-size: 14px;
    }

    /* Главная кнопка Stars */
    .donate-btn {
      background-color: var(--accent-color);
      color: var(--button-text);
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      transition: background-color 0.2s ease;
    }

    .donate-btn:active {
      background-color: var(--accent-hover);
    }

    /* Разделитель */
    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      color: var(--hint-color);
      font-size: 12px;
      margin: 20px 0;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .divider:not(:empty)::before {
      margin-right: .8em;
    }

    .divider:not(:empty)::after {
      margin-left: .8em;
    }

    /* Альтернативная кнопка (DonationAlerts) */
    .da-btn {
      background: rgba(245, 124, 0, 0.12);
      color: #ffb74d;
      border: 1px solid rgba(245, 124, 0, 0.3);
      padding: 12px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .da-btn:active {
      background: rgba(245, 124, 0, 0.25);
    }
  </style>
</head>
<body>

  <div class="donate-card">
    <div class="avatar">☕</div>
    <h1>Поддержать автора</h1>
    <p>Если у вас есть желание поддержать меня и порадовать донатом — буду невероятно рада и благодарна! Ваша поддержка дарит вдохновение и мотивирует продолжать творить дальше. 💖</p>

    <!-- Быстрые варианты Telegram Stars -->
    <div class="donate-grid">
      <div class="donate-option active" onclick="selectPreset(15, this)">15 ⭐️</div>
      <div class="donate-option" onclick="selectPreset(50, this)">50 ⭐️</div>
      <div class="donate-option" onclick="selectPreset(100, this)">100 ⭐️</div>
    </div>

    <!-- Поле ввода своей суммы -->
    <div class="input-wrapper">
      <input 
        type="number" 
        id="custom-stars" 
        class="custom-donate-input" 
        placeholder="Или введите свою сумму" 
        min="1" 
        oninput="onCustomInput(this)"
      >
    </div>

    <!-- Кнопка оплаты Telegram Stars -->
    <button class="donate-btn" onclick="sendDonate()">
      Поддержать за <span id="amount-label">15</span> ⭐️
    </button>

    <!-- Разделитель -->
    <div class="divider">или картой / другим способом</div>

    <!-- Альтернатива: DonationAlerts -->
    <a href="https://www.donationalerts.com/r/morika_sims" target="_blank" class="da-btn" onclick="openDA(event)">
      🧡 Донат через DonationAlerts
    </a>
  </div>

  <script>
    // Инициализация Telegram WebApp
    const tg = window.Telegram.WebApp;
    tg.expand();

    let currentAmount = 15; // Сумма по умолчанию

    // Выбор готового варианта
    function selectPreset(amount, element) {
      currentAmount = amount;
      
      document.querySelectorAll('.donate-option').forEach(el => el.classList.remove('active'));
      element.classList.add('active');
      
      document.getElementById('custom-stars').value = '';
      updateLabel(amount);
    }

    // Ввод своей суммы пользователем
    function onCustomInput(input) {
      const value = parseInt(input.value, 10);
      
      document.querySelectorAll('.donate-option').forEach(el => el.classList.remove('active'));

      if (value && value > 0) {
        currentAmount = value;
        updateLabel(value);
      } else {
        currentAmount = 0;
        updateLabel(0);
      }
    }

    function updateLabel(amount) {
      document.getElementById('amount-label').innerText = amount;
    }

    // Отправка доната в Звёздах
    async function sendDonate() {
      if (!currentAmount || currentAmount < 1) {
        tg.showAlert('Пожалуйста, укажите количество звёзд для доната.');
        return;
      }

      tg.MainButton.setText('Подготовка счёта...').show();

      try {
        const response = await fetch('YOUR_BACKEND_URL/create-donate-invoice', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            amount: currentAmount,
            initData: tg.initData
          })
        });

        const data = await response.json();

        if (data.invoiceLink) {
          tg.openInvoice(data.invoiceLink, (status) => {
            if (status === 'paid') {
              tg.showAlert('Огромное спасибо за поддержку! 💖');
            } else if (status === 'cancelled') {
              tg.showAlert('Оплата отменена.');
            }
          });
        }
      } catch (err) {
        tg.showAlert(`Форма готова! Выбрано: ${currentAmount} ⭐️`);
      } finally {
        tg.MainButton.hide();
      }
    }

    // Безопасное открытие внешних ссылок внутри Telegram
    function openDA(event) {
      event.preventDefault();
      tg.openLink('https://www.donationalerts.com/r/morika_sims');
    }
  </script>
</body>
</html>
